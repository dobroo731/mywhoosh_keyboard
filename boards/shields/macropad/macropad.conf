# Внутренний RC-генератор
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Отключаем DCDC для китайских плат без дросселей
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Отключаем запрос ПИН-кода по Bluetooth
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Усиливаем сигнал Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Работа по USB и Bluetooth
CONFIG_ZMK_USB=y

# Автоматический глубокий сон (Deep Sleep) через 40 минут бездействия (2 400 000 мс)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2400000
